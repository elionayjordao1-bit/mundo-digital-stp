<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mundo Digital STP - ERP & POS Web PWA</title>
  
  <!-- CSS Base e Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
</head>
<body class="bg-gray-100 text-gray-800 antialiased min-h-screen flex flex-col">

  <!-- Status Bar de Conexão (Offline / Online) -->
  <div id="offline-banner" class="hidden bg-amber-500 text-white text-center text-sm py-1 font-semibold">
    ⚠️ Você está Offline. Vendas do POS serão salvas localmente e sincronizadas quando a rede voltar.
  </div>

  <!-- Header / Navegação -->
  <header class="bg-indigo-700 text-white shadow-md">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide">Mundo Digital STP</h1>
      <div id="user-info" class="text-sm flex items-center gap-3">
        <span id="user-display">Carregando usuário...</span>
        <button id="btn-logout" class="bg-indigo-800 hover:bg-indigo-900 px-3 py-1 rounded text-xs">Sair</button>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container mx-auto px-4 py-6 flex-1">
    
    <!-- Painel Simples do POS -->
    <section class="bg-white p-6 rounded-lg shadow mb-6">
      <h2 class="text-lg font-bold mb-4 text-gray-700">Ponto de Venda (POS)</h2>
      
      <form id="pos-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Produto</label>
          <input type="text" id="pos-produto" required class="w-full border rounded p-2 text-sm" placeholder="Nome do produto" />
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Valor (STN)</label>
            <input type="number" id="pos-valor" required class="w-full border rounded p-2 text-sm" placeholder="0.00" step="0.01" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Quantidade</label>
            <input type="number" id="pos-qtd" required value="1" min="1" class="w-full border rounded p-2 text-sm" />
          </div>
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded transition">
          Finalizar Venda
        </button>
      </form>
    </section>

    <!-- Tabela de Logs de Auditoria (Visível para Admin) -->
    <section id="audit-section" class="bg-white p-6 rounded-lg shadow">
      <h2 class="text-lg font-bold mb-4 text-gray-700">Logs de Auditoria (Admin)</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm border-collapse">
          <thead>
            <tr class="bg-gray-100 border-b">
              <th class="p-2">Data/Hora</th>
              <th class="p-2">Operador</th>
              <th class="p-2">Ação</th>
              <th class="p-2">Detalhes</th>
            </tr>
          </thead>
          <tbody id="audit-logs-table">
            <tr>
              <td colspan="4" class="p-4 text-center text-gray-500">Nenhum registro carregado.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- MÓDULO JS: Firebase Modular SDK + Suporte Offline + Auditoria -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      enableMultiTabIndexedDbPersistence, 
      collection, 
      addDoc, 
      onSnapshot, 
      query, 
      orderBy, 
      limit, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // 1. Configuração do Firebase (Substitua pelas suas credenciais reais)
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "seu-projeto.firebaseapp.com",
      projectId: "seu-projeto",
      storageBucket: "seu-projeto.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;

    // 2. Ativar Persistência Offline do Firestore (Cache Local)
    enableMultiTabIndexedDbPersistence(db).catch((err) => {
      if (err.code === 'failed-precondition') {
        console.warn('Persistência desativada: Múltiplas abas abertas simultaneamente.');
      } else if (err.code === 'unimplemented') {
        console.warn('Navegador atual não suporta persistência offline do Firestore.');
      }
    });

    // 3. Gerenciador de Banco Local IndexedDB para a Fila de Vendas Offline do POS
    const DB_NAME = 'MundoDigital_POS_DB';
    const DB_VERSION = 1;

    function openOfflineDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('pending_sales')) {
            database.createObjectStore('pending_sales', { keyPath: 'id' });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function saveSaleOffline(saleData) {
      const idb = await openOfflineDB();
      const tx = idb.transaction('pending_sales', 'readwrite');
      const store = tx.objectStore('pending_sales');
      store.put(saleData);
      return tx.complete;
    }

    async function syncPendingSales() {
      if (!navigator.onLine) return;
      const idb = await openOfflineDB();
      const tx = idb.transaction('pending_sales', 'readwrite');
      const store = tx.objectStore('pending_sales');
      const request = store.getAll();

      request.onsuccess = async () => {
        const pendingSales = request.result;
        for (const sale of pendingSales) {
          try {
            // Tenta enviar para a coleção do Firebase
            await addDoc(collection(db, "vendas"), {
              produto: sale.produto,
              valor: sale.valor,
              qtd: sale.qtd,
              vendedor: sale.vendedor,
              data: serverTimestamp(),
              criadoOffline: true,
              dataOffline: sale.timestamp
            });

            // Registra no Log de Auditoria a sincronização
            await logAuditEvent("OFFLINE_SYNC_SALE", "vendas", "N/A", {
              produto: sale.produto,
              valorTotal: sale.valor * sale.qtd
            });

            // Remove do IndexedDB local após sucesso
            const delTx = idb.transaction('pending_sales', 'readwrite');
            delTx.objectStore('pending_sales').delete(sale.id);
          } catch (error) {
            console.error("Falha ao sincronizar venda offline ID " + sale.id, error);
          }
        }
      };
    }

    // Monitoramento da Rede (Online/Offline)
    const banner = document.getElementById('offline-banner');
    function updateOnlineStatus() {
      if (navigator.onLine) {
        banner.classList.add('hidden');
        syncPendingSales();
      } else {
        banner.classList.remove('hidden');
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    // 4. Função Global de Auditoria (Audit Trail)
    async function logAuditEvent(action, targetCollection, targetId, details = {}) {
      try {
        await addDoc(collection(db, "audit_logs"), {
          timestamp: serverTimestamp(),
          userId: currentUser ? currentUser.uid : "anonimo",
          userName: currentUser ? currentUser.email : "Desconhecido",
          userRole: currentUser ? (currentUser.role || "vendedor") : "vendedor",
          action: action,
          targetCollection: targetCollection,
          targetId: targetId,
          details: details,
          userAgent: navigator.userAgent
        });
      } catch (err) {
        console.error("Erro ao gravar log de auditoria:", err);
      }
    }

    // 5. Autenticação e Carregamento de Dados
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('user-display').innerText = user.email;
        loadAuditLogs();
      } else {
        document.getElementById('user-display').innerText = "Não autenticado";
      }
    });

    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    // 6. Submissão de Venda no POS (Com fallback Offline)
    document.getElementById('pos-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const salePayload = {
        id: 'sale_' + Date.now(),
        produto: document.getElementById('pos-produto').value,
        valor: parseFloat(document.getElementById('pos-valor').value),
        qtd: parseInt(document.getElementById('pos-qtd').value),
        vendedor: currentUser ? currentUser.email : "vendedor_local",
        timestamp: new Date().toISOString()
      };

      if (navigator.onLine) {
        try {
          await addDoc(collection(db, "vendas"), {
            ...salePayload,
            data: serverTimestamp()
          });
          await logAuditEvent("CREATE_SALE", "vendas", salePayload.id, {
            produto: salePayload.produto,
            total: salePayload.valor * salePayload.qtd
          });
          alert("Venda realizada e sincronizada com sucesso!");
        } catch (err) {
          console.warn("Erro ao salvar online, guardando em fila local...", err);
          await saveSaleOffline(salePayload);
          alert("Venda salva localmente! Será enviada quando a rede estabilizar.");
        }
      } else {
        await saveSaleOffline(salePayload);
        alert("Modo Offline: Venda registrada no dispositivo local com sucesso.");
      }

      document.getElementById('pos-form').reset();
    });

    // 7. Renderização em Tempo Real dos Logs de Auditoria
    function loadAuditLogs() {
      const q = query(collection(db, "audit_logs"), orderBy("timestamp", "desc"), limit(10));
      onSnapshot(q, (snapshot) => {
        const tbody = document.getElementById('audit-logs-table');
        tbody.innerHTML = '';
        if (snapshot.empty) {
          tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Nenhum log encontrado.</td></tr>';
          return;
        }
        snapshot.forEach((doc) => {
          const log = doc.data();
          const dateStr = log.timestamp ? new Date(log.timestamp.toDate()).toLocaleString('pt-PT') : 'A processar...';
          const row = document.createElement('tr');
          row.className = "border-b hover:bg-gray-50";
          row.innerHTML = `
            <td class="p-2 text-xs">${dateStr}</td>
            <td class="p-2 font-medium">${log.userName}</td>
            <td class="p-2"><span class="bg-indigo-100 text-indigo-800 text-xs px-2 py-0.5 rounded">${log.action}</span></td>
            <td class="p-2 text-xs text-gray-600">${JSON.stringify(log.details)}</td>
          `;
          tbody.appendChild(row);
        });
      });
    }
  </script>
</body>
</html>
